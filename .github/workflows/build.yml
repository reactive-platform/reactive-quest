name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      # Consumers get Yoga's headers from shared/, since a QPM package only ships that directory.
      - name: Check the Yoga headers match the submodule
        run: |
          for header in shared/yoga/*.h; do
            cmp "$header" "lib/yoga/yoga/$(basename "$header")"
          done

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          jq --arg version "${GITHUB_REF_NAME#v}" '.info.version = $version' qpm.json > qpm.json.tmp
          mv qpm.json.tmp qpm.json

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up QPM
        uses: fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: true
          resolve_ndk: true
          cache: true

      - name: Build
        run: |
          qpm s build
          qpm s qmod

      - name: Collect the outputs
        run: |
          mkdir output
          cp build/libreactive.so output/libreactive.so
          cp build/debug/libreactive.so output/debug_libreactive.so
          cp Reactive.qmod output/Reactive.qmod

      - name: Upload the outputs
        uses: actions/upload-artifact@v5
        with:
          name: reactive
          path: output/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the outputs
        uses: actions/download-artifact@v5
        with:
          name: reactive

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libreactive.so
            debug_libreactive.so
            Reactive.qmod
